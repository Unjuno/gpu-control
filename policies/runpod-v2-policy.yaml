version: 1

provider: runpod
api:
  version: v2-beta
  base_url: https://api.runpod.io/v2
  authentication: bearer_header
  live_calls_enabled: false
  live_adapter_enabled: false
  cli_enabled: false
  workflow_enabled: false

api_contract_audit:
  audited_at_utc: 2026-08-27T21:34:00Z
  implementation_contract: rest_v2_public_beta_offline
  current_official_rest_base_observed: https://api.runpod.io/v2
  current_official_contract_revalidation_required: true
  implementation_may_not_be_enabled_live_until_revalidated: true
  live_enablement_by_flag_only_forbidden: true
  create_env_contract_observed: true
  list_pods_contract_observed: true
  list_pods_endpoint: GET /pods
  list_pods_response_envelope: pods
  list_pods_server_side_name_filter_supported: false
  list_pods_evidence_repository: runpod/runpod-mcp
  list_pods_evidence_commit: 465872464c4f157a2e87afcd855c60a607954c26
  list_pods_evidence_path: src/tools/pods.ts
  pod_container_log_sse_status: dev_only_prod_unavailable
  pod_container_log_sse_prod_verified: false
  pod_container_log_sse_prod_failure: http_422_path_not_found
  pod_container_log_sse_live_collection_allowed: false
  pod_container_log_sse_evidence_repository: runpod/runpod-mcp
  pod_container_log_sse_evidence_commit: 465872464c4f157a2e87afcd855c60a607954c26
  pod_container_log_sse_evidence_path: test.md
  pod_container_log_sse_evidence_section: "K — Dev-only tools, currently DISABLED (not registered)"
  pod_container_log_sse_evidence_url: https://github.com/runpod/runpod-mcp/blob/465872464c4f157a2e87afcd855c60a607954c26/test.md
  note: RunPod REST API v2 is live in production at the canonical api.runpod.io/v2 origin. The pinned official MCP implementation confirms full-account GET /v2/pods with local filtering semantics, while its validation records GET /v2/pods/{id}/logs as dev-only and returning HTTP 422 path-not-found in production. gpu-control may model bounded create/cleanup reconciliation against List Pods offline, but must not wire authenticated production result collection to the unavailable logs endpoint. Live calls remain disabled, and the complete current official contract must be revalidated immediately before any activation.

submission:
  approved_plan_required: true
  published_image_evidence_required: true
  catalog_pricing_evidence_required: true
  account_occupancy_evidence_required: true
  image_reference_must_be_digest_pinned: true
  published_image_must_match_plan_fingerprint: true
  published_image_digest_must_match_plan: true
  gpu_type_id_from_verified_pricing: true
  create_cloud_from_catalog_pricing_evidence: true
  gpu_count: 1
  global_networking: false
  user_ports_forwarded: false
  user_env_forwarded: false
  user_mounts_forwarded: false
  automatic_create_retry: false
  ambiguous_create_requires_reconciliation: true
  ambiguous_create_reconciliation_status: implemented_offline_mock_tested
  ambiguous_create_reconciliation_live_verified: false
  ambiguous_create_reconciliation_requires_per_execution_identity: true
  ambiguous_create_reconciliation_inventory_endpoint: GET /pods
  ambiguous_create_reconciliation_inventory_max_entries: 256
  ambiguous_create_reconciliation_inventory_max_ttl_seconds: 60
  ambiguous_create_zero_match: reject
  ambiguous_create_multiple_match: reject
  ambiguous_create_terminated_only_match: reject
  ambiguous_create_candidate_requires_full_get_revalidation: true
  pre_create_account_must_have_zero_non_terminated_pods: true
  post_create_account_must_contain_only_new_pod: true
  occupancy_evidence_max_ttl_seconds: 60
  occupancy_failure_is_fail_closed: true
  post_create_identity_revalidation: true
  post_create_cloud_revalidation: true
  post_create_price_must_not_exceed_verified_price: true
  post_create_validation_failure_terminates_known_pod: true
  post_create_exclusivity_failure_terminates_new_pod: true
  compensating_termination_failure_is_visible: true

completion_evidence:
  protocol: hmac-sha256-v2
  implementation_status: pre_create_identity_and_env_contract_offline
  per_run_nonce_required: true
  pre_create_execution_name_required: true
  minimum_secret_bytes: 32
  secret_persistence: forbidden
  secret_logging: forbidden
  user_override: forbidden
  system_environment_owner: gpu-control
  system_environment:
    - GPU_CONTROL_COMPLETION_KEY_B64
    - GPU_CONTROL_COMPLETION_KEY_ID
    - GPU_CONTROL_COMPLETION_NONCE
    - GPU_CONTROL_EXECUTION_NAME
    - GPU_CONTROL_PLAN_FINGERPRINT
    - GPU_CONTROL_IMAGE_DIGEST
  binds:
    - key_id
    - nonce
    - approved_plan_fingerprint
    - execution_name
    - workload_source_sha
    - image_digest
    - result_sha256
  provider_job_id_binding: submission_receipt_and_provider_specific_collection_transport
  result_marker: "GPU_CONTROL_RESULT_JSON_V1:"
  completion_marker: "GPU_CONTROL_COMPLETION_JSON_V2:"
  max_marker_bytes: 16384
  offline_marker_authentication_allowed: true
  production_collection_transport_status: blocked_pending_supported_provider_transport
  live_injection_enabled: false
  live_collection_enabled: false

status:
  provisioning: submitted
  starting: submitted
  running: running
  error: failed
  terminated: cancelled
  exited: ambiguous_requires_workload_completion_evidence
  unknown: reject

cleanup:
  terminate_endpoint: DELETE /pods/{id}
  terminate_is_irreversible: true
  cleanup_failure_visible: true
  idempotent_already_absent_reconciliation_required_before_live: true
  idempotent_reconciliation_status: implemented_offline_mock_tested
  idempotent_reconciliation_live_verified: false
  reconciliation_inventory_endpoint: GET /pods
  reconciliation_accept_absent_exact_pod: true
  reconciliation_accept_explicit_terminated_exact_pod: true
  reconciliation_reject_active_exact_pod: true
  reconciliation_invalid_inventory_is_failure: true

results:
  enabled: false
  requires_authenticated_workload_completion_evidence: true
  production_transport_must_be_currently_supported: true

catalog:
  endpoint: GET /catalog/gpus
  include_availability: true
  product: POD
  gpu_count: 1
  evidence_max_ttl_seconds: 300
  required_availability: HIGH
  require_high_availability_datacenter: true
  require_profile_min_vram: true
  require_cloud_price: true
  require_cloud_capacity: true

forbidden:
  - live_runpod_call_from_ci
  - live_runpod_call_from_public_cli
  - live_adapter_from_public_cli
  - live_enablement_without_current_official_api_contract_revalidation
  - live_enablement_by_policy_flag_only
  - arbitrary_api_origin
  - api_key_in_query_string
  - api_key_in_logs_or_errors
  - mutable_tag_only_image
  - submit_image_not_bound_to_approved_plan
  - submission_cloud_not_bound_to_pricing_evidence
  - stale_catalog_pricing_evidence
  - catalog_gpu_below_profile_vram
  - catalog_gpu_without_one_gpu_capacity
  - create_without_account_occupancy_evidence
  - create_while_another_non_terminated_pod_exists
  - losing_account_exclusivity_after_create
  - automatic_retry_after_ambiguous_create
  - ambiguous_create_without_reconciliation
  - ambiguous_create_reconciliation_without_per_execution_identity
  - accepting_zero_or_multiple_ambiguous_create_matches
  - accepting_reconciled_candidate_without_full_identity_revalidation
  - unverified_post_create_gpu_identity
  - create_response_cloud_mismatch
  - accepting_price_above_verified_price
  - leaving_known_invalid_created_pod_running
  - hiding_compensating_termination_failure
  - forwarding_user_environment_to_provider
  - allowing_user_override_of_completion_system_environment
  - persisting_completion_secret_in_lifecycle_json
  - logging_completion_secret
  - treating_exited_as_success_without_completion_evidence
  - treating_unknown_provider_status_as_success
  - collecting_results_without_authenticated_completion_evidence
  - collecting_live_results_through_unavailable_prod_pod_log_sse
  - treating_dev_only_provider_operation_as_production_contract
  - treating_cleanup_404_as_success_without_reconciliation_policy
  - treating_active_pod_as_cleanup_success_after_terminate_error
