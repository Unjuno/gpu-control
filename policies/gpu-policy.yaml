version: 1

hard_limits:
  max_gpu_count: 1
  max_runtime_minutes: 60
  max_cost_usd: 1.00

profiles:
  cheap-24gb:
    description: Lowest-cost single-GPU profile with at least 24 GB VRAM.
    min_vram_gb: 24
    max_gpu_count: 1
    max_runtime_minutes: 30
    max_cost_usd: 0.30

  fast-24gb:
    description: Faster single-GPU profile with at least 24 GB VRAM.
    min_vram_gb: 24
    max_gpu_count: 1
    max_runtime_minutes: 30
    max_cost_usd: 0.50

  large-vram:
    description: Single-GPU profile for workloads requiring at least 48 GB VRAM.
    min_vram_gb: 48
    max_gpu_count: 1
    max_runtime_minutes: 20
    max_cost_usd: 0.75
