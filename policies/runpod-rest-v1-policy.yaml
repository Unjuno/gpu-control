version: 1

provider: runpod
contract: rest_v1_current_official
status: transport_layer_implemented_offline_mock_tested

api:
  base_url: https://rest.runpod.io/v1
  authentication: bearer_header
  openapi_endpoint: GET /openapi.json
  live_calls_enabled: false
  adapter_migrated: false
  workflow_enabled: false

pod_endpoints:
  create: POST /pods
  list: GET /pods
  get: GET /pods/{id}
  delete: DELETE /pods/{id}
  delete_success_status: 204

list_pods:
  response_shape: array
  normalized_internal_envelope: pods
  allowed_statuses:
    - RUNNING
    - EXITED
    - TERMINATED
  status_field: desiredStatus
  duplicate_ids_rejected: true
  unknown_status_rejected: true

create:
  image_field: imageName
  gpu_type_field: gpuTypeIds
  gpu_count_field: gpuCount
  disk_field: containerDiskInGb
  cloud_field: cloudType
  environment_field: env
  network_volume_id_field: networkVolumeId
  network_volume_mount_field: volumeMountPath
  network_volume_data_center_field: dataCenterIds
  global_networking: false
  interruptible: false
  support_public_ip: false
  user_ports_forwarded: false
  user_environment_forwarded: false
  user_volume_configuration_forwarded: false
  trusted_completion_environment_only: true
  trusted_network_volume_only: true
  network_volume_requires_secure_cloud: true

response_normalization:
  status_source: desiredStatus
  hourly_cost_source: costPerHr
  gpu_source: gpu
  cloud_source: machine.secureCloud
  data_center_source: machine.dataCenterId
  network_volume_source: networkVolume
  volume_mount_source: volumeMountPath
  machine_evidence_required_for_adapter_identity_validation: true
  network_volume_identity_revalidated_when_configured: true

migration:
  current_v1_http_client_implemented: true
  current_v1_payload_builder_implemented: true
  current_v1_response_normalizer_implemented: true
  current_v1_list_array_normalizer_implemented: true
  current_v1_fixed_origin_tests_implemented: true
  provider_adapter_migration_pending: true
  occupancy_probe_migration_pending: true
  reconciliation_probe_migration_pending: true
  current_pricing_catalog_revalidation_pending: true
  live_provider_verification_pending: true

forbidden:
  - live_calls_before_adapter_migration
  - live_calls_before_current_pricing_revalidation
  - arbitrary_api_origin
  - api_key_in_query_string
  - api_key_in_logs_or_errors
  - accepting_non_array_list_pods_response
  - accepting_unknown_desired_status
  - accepting_duplicate_pod_ids
  - accepting_unvalidated_machine_cloud_identity
  - accepting_unvalidated_network_volume_identity
  - forwarding_untrusted_user_environment
  - forwarding_untrusted_user_ports
  - forwarding_untrusted_user_volume_configuration
