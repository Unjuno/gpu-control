name: Gateway comment bridge tests

on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-comments.yml'
      - '.github/workflows/gateway-bridge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-comments.yml'
      - '.github/workflows/gateway-bridge-ci.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolated gateway test dependencies
        run: python -m pip install -r gateway/requirements-test.txt
      - name: Comment, identity, HTTP and real service/queue tests
        env:
          PYTHONPATH: gateway
        run: python -m pytest -q gateway/tests/test_ci_bridge.py gateway/tests/test_ci_service_integration.py
      - name: Build the bounded CPU fixture
        run: docker build --pull -t gpu-control-tiny gateway/workloads/tiny-lm
      - name: Run real Docker smoke test
        run: |
          set -euo pipefail
          trap 'docker rm -f gateway-bridge-smoke >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=5s 30s docker run --rm \
            --name gateway-bridge-smoke --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --pids-limit 32 --memory 128m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            gpu-control-tiny > "$RUNNER_TEMP/tiny-lm.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'tiny-lm.json').read_text())
          assert result['gpu_used'] is False
          assert result['final_loss'] < result['initial_loss']
          assert result['steps'] == 40
          print(json.dumps(result))
          PY
