name: Lockfile generation

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install 'uv==0.10.0'

      - name: Generate lockfile
        run: |
          uv lock
          echo '---UV_LOCK_BEGIN---'
          cat uv.lock
          echo '---UV_LOCK_END---'
