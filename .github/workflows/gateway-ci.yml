name: Gateway offline tests

on:
  pull_request:
    paths: ["gateway/**", ".github/workflows/gateway-ci.yml"]
  push:
    branches: [main]
    paths: ["gateway/**", ".github/workflows/gateway-ci.yml"]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gateway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: gateway
    env:
      GATEWAY_TEST_DATABASE_URL: postgresql+psycopg://postgres:local-ci-only@localhost:5432/gateway_test
      GATEWAY_ENABLE_MODAL: "false"
      GATEWAY_ENABLE_RUNPOD_BRIDGE: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install isolated gateway test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-worker.txt
      - name: CPU and mocked-provider tests only
        run: python -m pytest -o addopts= -q
      - name: WebMCP registration contract
        run: node --test tests/webmcp.test.js
      - name: Python entrypoint compilation
        run: python -m compileall -q app.py gpu_gateway modal_worker.py
