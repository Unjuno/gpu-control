name: Sites provider runtime offline tests

on:
  pull_request:
    paths:
      - "gateway/gpu_gateway/_sites_provider_runtime.py"
      - "gateway/gpu_gateway/huggingface_artifacts.py"
      - "gateway/gpu_gateway/huggingface_space_backend.py"
      - "gateway/gpu_gateway/kaggle_backend.py"
      - "gateway/gpu_gateway/kaggle_bridge.py"
      - "gateway/gpu_gateway/orbitune_workload.py"
      - "gateway/tests/test_huggingface_artifacts.py"
      - "gateway/tests/test_huggingface_space_backend.py"
      - "gateway/tests/test_kaggle_backend.py"
      - "gateway/tests/test_kaggle_bridge.py"
      - "gateway/tests/test_orbitune_kaggle_workload.py"
      - "sites/gpu-control-sites/modal/**"
      - ".github/workflows/gateway-ci.yml"
  push:
    branches: [main]
    paths:
      - "gateway/gpu_gateway/_sites_provider_runtime.py"
      - "gateway/gpu_gateway/huggingface_artifacts.py"
      - "gateway/gpu_gateway/huggingface_space_backend.py"
      - "gateway/gpu_gateway/kaggle_backend.py"
      - "gateway/gpu_gateway/kaggle_bridge.py"
      - "gateway/gpu_gateway/orbitune_workload.py"
      - "gateway/tests/test_huggingface_artifacts.py"
      - "gateway/tests/test_huggingface_space_backend.py"
      - "gateway/tests/test_kaggle_backend.py"
      - "gateway/tests/test_kaggle_bridge.py"
      - "gateway/tests/test_orbitune_kaggle_workload.py"
      - "sites/gpu-control-sites/modal/**"
      - ".github/workflows/gateway-ci.yml"

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install isolated provider runtime test dependencies
        run: python -m pip install -r sites/gpu-control-sites/modal/requirements-provider-test.txt
      - name: Sites-owned provider runtime and compatibility contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/gateway:${{ github.workspace }}/sites/gpu-control-sites/modal
        run: >-
          python -m pytest --noconftest -q
          sites/gpu-control-sites/modal/test_provider_runtime.py
          sites/gpu-control-sites/modal/test_provider_adapter_packaging.py
          sites/gpu-control-sites/modal/test_provider_adapter_core.py
          gateway/tests/test_huggingface_artifacts.py
          gateway/tests/test_huggingface_space_backend.py
          gateway/tests/test_kaggle_backend.py
          gateway/tests/test_kaggle_bridge.py
          gateway/tests/test_orbitune_kaggle_workload.py
      - name: Provider runtime compilation
        run: python -m compileall -q sites/gpu-control-sites/modal/provider_runtime
