name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install 'uv==0.10.0'

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Standalone self-test
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/gpu-control" self-test

      - name: Test
        run: uv run --locked pytest

  reference-workload:
    name: Trusted reference container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build trusted reference image
        run: docker build --tag gpu-control-reference:ci examples/reference-workload

      - name: Run with bounded container privileges
        shell: bash
        env:
          GPU_CONTROL_SECRET_SENTINEL: host-only-sentinel
        run: |
          set -euo pipefail
          trap 'docker rm -f gpu-control-reference >/dev/null 2>&1 || true' EXIT

          docker create \
            --name gpu-control-reference \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 128m \
            --cpus 1 \
            --tmpfs '/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777' \
            --tmpfs '/outputs:rw,noexec,nosuid,nodev,size=1m,mode=1777' \
            gpu-control-reference:ci

          timeout 30s docker start -a gpu-control-reference | tee ./reference-result.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          result = json.loads(Path("reference-result.json").read_text(encoding="utf-8"))
          assert result["schema_version"] == 1
          assert result["status"] == "ok"
          assert result["workload_id"] == "gpu-control-reference"
          assert result["isolation_checks"] == {
              "credentials_absent": True,
              "docker_socket_absent": True,
              "gpu_devices_absent": True,
              "network_blocked": True,
          }

          inspect = json.loads(
              subprocess.check_output(
                  ["docker", "inspect", "gpu-control-reference"],
                  text=True,
              )
          )[0]
          host = inspect["HostConfig"]
          assert host["NetworkMode"] == "none"
          assert host["ReadonlyRootfs"] is True
          assert host["CapDrop"] == ["ALL"]
          assert "no-new-privileges" in host["SecurityOpt"]
          assert host["PidsLimit"] == 64
          assert host["Memory"] == 134217728
          assert host["NanoCpus"] == 1_000_000_000
          assert host["Privileged"] is False
          assert host["Devices"] in (None, [])
          assert host["Binds"] in (None, [])
          assert host["PidMode"] != "host"
          assert host["IpcMode"] != "host"

          environment = inspect["Config"].get("Env") or []
          sensitive_names = ("GITHUB_TOKEN", "RUNPOD_API_KEY", "GPU_CONTROL_SECRET_SENTINEL")
          for name in sensitive_names:
              assert not any(entry.startswith(f"{name}=") for entry in environment)
          PY
