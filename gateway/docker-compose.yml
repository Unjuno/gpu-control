services:
  artifact-init:
    image: gpu-control-gateway:local
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /artifacts && chmod 0700 /artifacts"]
    volumes:
      - gateway-artifacts:/artifacts
    restart: "no"

  api:
    image: gpu-control-gateway:local
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/gateway
      GATEWAY_PUBLIC_URL: http://localhost:8000
      GATEWAY_ENABLE_MODAL: "false"
      GATEWAY_ENABLE_RUNPOD_BRIDGE: "false"
      GATEWAY_WORKLOADS_JSON: '{"demo":{"provider":"demo"}}'
      GATEWAY_ARTIFACT_DIR: /var/lib/gpu-control/artifacts
    volumes:
      - gateway-artifacts:/var/lib/gpu-control/artifacts
    depends_on:
      db:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: gateway/Dockerfile.worker
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/gateway
      GATEWAY_ENABLE_MODAL: "false"
      GATEWAY_ENABLE_RUNPOD_BRIDGE: "false"
      GATEWAY_WORKLOADS_JSON: '{"demo":{"provider":"demo"}}'
      GATEWAY_ARTIFACT_DIR: /var/lib/gpu-control/artifacts
    volumes:
      - gateway-artifacts:/var/lib/gpu-control/artifacts
    depends_on:
      db:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gateway-db:/var/lib/postgresql/data

volumes:
  gateway-db:
  gateway-artifacts:
