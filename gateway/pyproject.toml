[project]
name = "gpu-control-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "starlette==0.50.0",
  "pydantic==2.13.4",
  "SQLAlchemy==2.0.50",
  "PyJWT[crypto]==2.13.0",
  "cryptography==46.0.4",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "uvicorn==0.48.0",
  "psycopg[binary]>=3.2,<4",
  "gpu-control",
]
# `requirements.txt` additionally installs the monorepo's local `gpu-control`
# package with `-e ..` for pip-based environments. Vercel resolves the uv
# source below from the repository root during its Python build.

[tool.uv.sources]
gpu-control = { path = "..", editable = true }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gpu_gateway*"]

[tool.setuptools.package-data]
gpu_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
