[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-control"
version = "0.1.0"
description = "Policy-driven control plane for containerized GPU workloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Unjuno" }]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
gpu-control = "gpu_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_control = ["default_policy.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
